<!doctype html>
<html lang="en" data-theme="black">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Fast UI Mock</title>
<!--
  Visual target for the "Fast UI" mode of Better Browsing for X (see x/FAST-UI-PLAN.md).
  Self-contained: no external files, fonts, images or scripts. Open it straight from disk.
  Everything here is sample data. Not shipped in any bundle.
-->
<style>
/* ---------- themes: custom properties, one block per X theme ---------- */
:root {
  color-scheme: dark;
  --bg: #000;
  --bg-2: #16181c;
  --bg-hover: #080808;
  --bg-elev: #000;
  --line: #2f3336;
  --text: #e7e9ea;
  --muted: #71767b;
  --accent: oklch(0.66 0.17 245);      /* X blue */
  --accent-soft: oklch(0.66 0.17 245 / 0.12);
  --like: oklch(0.63 0.24 2);
  --like-soft: oklch(0.63 0.24 2 / 0.12);
  --rt: oklch(0.70 0.16 160);
  --rt-soft: oklch(0.70 0.16 160 / 0.12);
  --gold: oklch(0.80 0.15 85);
  --note-bg: #000;
  --shadow: 0 0 15px rgb(255 255 255 / 0.2), 0 0 3px 1px rgb(255 255 255 / 0.15);
  --topbar: 48px;
  --radius: 16px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
:root[data-theme="dim"] {
  --bg: #15202b;
  --bg-2: #1e2732;
  --bg-hover: #1a2531;
  --bg-elev: #15202b;
  --line: #38444d;
  --text: #f7f9f9;
  --muted: #8b98a5;
  --note-bg: #15202b;
  --shadow: 0 0 15px rgb(255 255 255 / 0.15), 0 0 3px 1px rgb(255 255 255 / 0.1);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #fff;
  --bg-2: #f7f9f9;
  --bg-hover: #f7f7f7;
  --bg-elev: #fff;
  --line: #eff3f4;
  --text: #0f1419;
  --muted: #536471;
  --note-bg: #fff;
  --shadow: 0 0 15px rgb(101 119 134 / 0.2), 0 0 3px 1px rgb(101 119 134 / 0.15);
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/20px var(--font);
  -webkit-font-smoothing: antialiased;
  transition: background-color .2s, color .2s;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); text-decoration: none; &:hover { text-decoration: underline; } }
svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.fill { fill: currentColor; stroke: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- top bar (Fast UI controls) ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  height: var(--topbar);
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  & .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap;
    & svg { color: var(--accent); width: 20px; height: 20px; }
    & small { font-weight: 500; color: var(--muted); }
  }
  & .spacer { flex: 1; }
  & .stat { color: var(--muted); font-size: 13px; white-space: nowrap; }
}
.seg {
  display: inline-flex; padding: 3px; gap: 2px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--bg-2);
  & button {
    padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    &:hover { color: var(--text); }
    &[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--line);
      & .sw { outline: 2px solid var(--accent); outline-offset: 1px; } }
  }
  & .sw { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--muted); }
}
.native-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
  font-size: 13px; font-weight: 700; white-space: nowrap;
  &:hover { background: var(--bg-2); }
}

/* ---------- 3-column layout ---------- */
.layout {
  display: grid;
  grid-template-columns: 275px minmax(0, 600px) 350px;
  justify-content: center;
}

/* left nav rail */
.rail {
  position: sticky; top: var(--topbar);
  align-self: start;
  display: flex; flex-direction: column; gap: 2px;
  padding: 8px 12px 12px;
  & .nav {
    display: flex; align-items: center; gap: 20px;
    padding: 12px; border-radius: 999px; font-size: 20px; line-height: 24px;
    width: max-content; color: var(--text);
    &:hover { background: var(--bg-2); text-decoration: none; }
    & svg { width: 26px; height: 26px; }
    &[aria-current="page"] { font-weight: 700; & svg { stroke-width: 2.4; } }
    & .ext { width: 13px; height: 13px; color: var(--muted); margin-left: -12px; }
  }
  & .post-btn {
    margin: 16px 0 0; width: 90%; height: 52px; border-radius: 999px;
    background: var(--text); color: var(--bg); font-size: 17px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    & svg { display: none; }
    &:hover { opacity: .9; }
  }
  & .me {
    margin-top: auto; display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: 999px; text-align: left;
    &:hover { background: var(--bg-2); }
    & .who { line-height: 18px; min-width: 0; & b, & span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } & span { color: var(--muted); } }
  }
}

/* main feed column */
main {
  min-width: 0;
  border-inline: 1px solid var(--line);
  min-height: 600px;
}
.col-head {
  position: sticky; top: var(--topbar); z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  & h1 { margin: 0; padding: 12px 16px 0; font-size: 20px; line-height: 24px; }
  & .bar { display: flex; align-items: center; gap: 24px; padding: 0 16px; height: 53px;
    & h1 { padding: 0; }
    & .back { width: 34px; height: 34px; margin-left: -8px; border-radius: 50%; display: grid; place-items: center; &:hover { background: var(--bg-2); } }
  }
}
.tabs {
  display: flex;
  & button {
    flex: 1; height: 53px; position: relative; color: var(--muted); font-weight: 500;
    &:hover { background: var(--bg-2); }
    &[aria-selected="true"] { color: var(--text); font-weight: 700;
      &::after { content: ""; position: absolute; left: 50%; bottom: 0; translate: -50% 0; width: 56px; height: 4px; border-radius: 4px; background: var(--accent); }
    }
  }
}
.new-pill {
  display: block; width: 100%; padding: 14px; text-align: center; color: var(--accent);
  border-bottom: 1px solid var(--line);
  &:hover { background: var(--bg-hover); }
}

/* ---------- tweet row ---------- */
.tweet {
  display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 0 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  contain: layout style paint;     /* the same containment every virtualised row gets */
  transition: background-color .12s;
  &:hover { background: var(--bg-hover); }
  &:focus-visible { outline-offset: -2px; }
  & .ctx {
    grid-column: 1 / -1; display: grid; grid-template-columns: 40px 1fr; gap: 12px;
    color: var(--muted); font-size: 13px; font-weight: 700; margin: -4px 0 4px;
    & svg { justify-self: end; width: 16px; height: 16px; }
  }
  & .body { min-width: 0; }
  & .head {
    display: flex; align-items: center; gap: 4px; min-width: 0; white-space: nowrap;
    & .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    & .handle, & .dot, & time { color: var(--muted); }
    & .handle { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    & .more { margin-left: auto; color: var(--muted); width: 34px; height: 34px; margin-block: -8px; margin-right: -8px; border-radius: 50%; display: grid; place-items: center;
      &:hover { background: var(--accent-soft); color: var(--accent); } }
  }
  & .text { margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere;
    &.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden; }
  }
  & .show-more { color: var(--accent); margin-top: 2px; &:hover { text-decoration: underline; } }
  & .reply-to { color: var(--muted); margin-top: 2px; }
}
.badge { width: 18px; height: 18px; color: var(--accent); &.gold { color: var(--gold); } }

/* avatars: initials on a hue, no external images */
.av {
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; flex: none;
  font-weight: 700; font-size: 15px; color: #fff; letter-spacing: .02em;
  background: linear-gradient(140deg, oklch(0.52 0.15 var(--h)), oklch(0.38 0.13 calc(var(--h) + 40)));
  text-shadow: 0 1px 2px rgb(0 0 0 / .35);
  &.sq { border-radius: 10px; }
  &.sm { width: 20px; height: 20px; font-size: 9px; }
  &.lg { width: 48px; height: 48px; font-size: 17px; }
}

/* ---------- media ---------- */
.media {
  margin-top: 12px; border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--line);
  display: grid; gap: 2px; background: var(--line);
  &.n1 { aspect-ratio: auto; }
  &.n2 { grid-template-columns: 1fr 1fr; aspect-ratio: 16 / 9; }
  &.n3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 16 / 9;
    & > :first-child { grid-row: 1 / 3; } }
  &.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 16 / 9; }
  & .ph { position: relative; min-height: 0; overflow: hidden; background: var(--bg-2); cursor: zoom-in;
    & img { display: block; width: 100%; height: 100%; object-fit: cover; transition: scale .25s; }
    &:hover img { scale: 1.02; }
    & .alt { position: absolute; left: 8px; bottom: 8px; padding: 0 5px; border-radius: 4px; font: 700 12px/18px var(--font); color: #fff; background: rgb(0 0 0 / .75); }
  }
  &.n1 .ph img { height: auto; max-height: 510px; }
}

/* video: native controls + audio indicator */
.vid {
  position: relative; margin-top: 12px; border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--line); background: #000; aspect-ratio: 16 / 9;
  & video { display: block; width: 100%; height: 100%; background: #000; }
  & .start {
    position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer;
    background: center / cover no-repeat var(--poster);
    & span { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; border: 4px solid #fff; box-shadow: 0 2px 12px rgb(0 0 0 / .4);
      & svg { width: 26px; height: 26px; margin-left: 3px; } }
  }
  & .audio {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 8px; border-radius: 999px;
    font: 700 12px/16px var(--font); color: #fff; background: rgb(0 0 0 / .65);
    pointer-events: none;
    & svg { width: 15px; height: 15px; }
    & .meter { display: inline-flex; align-items: end; gap: 2px; height: 12px;
      & i { width: 3px; border-radius: 1px; background: var(--rt); height: 20%; transition: height .08s; } }
    &[data-on="false"] .meter i { background: #999; height: 20% !important; }
  }
  & .dur { position: absolute; left: 10px; bottom: 10px; padding: 0 6px; border-radius: 4px; font: 700 12px/18px var(--font); color: #fff; background: rgb(0 0 0 / .7); pointer-events: none; }
}

/* quote card */
.quote {
  margin-top: 12px; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
  transition: background-color .12s;
  &:hover { background: var(--bg-2); }
  & .head { display: flex; align-items: center; gap: 4px; white-space: nowrap; min-width: 0;
    & .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
    & .handle, & .dot, & time { color: var(--muted); } }
  & .text { margin-top: 4px; }
  & .media { margin-top: 10px; border-radius: 12px; }
}

/* poll */
.poll {
  margin-top: 12px; display: grid; gap: 8px;
  & .opt {
    position: relative; height: 34px; border-radius: 6px; text-align: left;
    padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    border: 1px solid var(--accent); color: var(--accent); font-weight: 700;
    &:hover { background: var(--accent-soft); }
  }
  &.voted .opt {
    border: 0; color: var(--text); font-weight: 400; cursor: default; overflow: hidden; isolation: isolate;
    &:hover { background: none; }
    &::before { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p); border-radius: 6px; background: var(--line); z-index: -1; transition: width .5s cubic-bezier(.2,.8,.2,1); }
    &.win { font-weight: 700; &::before { background: oklch(from var(--accent) l c h / .35); } }
    & .pick { color: var(--accent); }
  }
  & .meta { color: var(--muted); font-size: 14px; }
}

/* community note */
.cnote {
  margin-top: 12px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--note-bg);
  & header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 4px; font-weight: 700;
    & svg { width: 18px; height: 18px; color: var(--accent); } }
  & p { margin: 0; padding: 4px 12px 12px; }
  & footer { border-top: 1px solid var(--line); padding: 10px 12px; color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; gap: 8px;
    & button { color: var(--accent); font-weight: 700; } }
}

/* ---------- action bar (Better Browsing QoL) ---------- */
.actions {
  display: flex; justify-content: space-between; margin: 10px -8px -4px; max-width: 470px;
  & .act {
    display: inline-flex; align-items: center; gap: 2px; color: var(--muted); font-size: 13px; min-width: 0;
    & .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; transition: background-color .12s, color .12s;
      & svg { width: 18.75px; height: 18.75px; } }
    & .n { min-width: 2.4ch; text-align: left; font-variant-numeric: tabular-nums; }
    &[data-k="reply"]:hover, &[data-k="bm"]:hover, &[data-k="copy"]:hover { color: var(--accent); & .ic { background: var(--accent-soft); } }
    &[data-k="rt"]:hover { color: var(--rt); & .ic { background: var(--rt-soft); } }
    &[data-k="like"]:hover, &[data-k="lrt"]:hover { color: var(--like); & .ic { background: var(--like-soft); } }
    &[data-k="rt"][aria-pressed="true"] { color: var(--rt); }
    &[data-k="like"][aria-pressed="true"] { color: var(--like); & svg { fill: currentColor; } }
    &[data-k="lrt"][aria-pressed="true"] { color: var(--like); }
    &[data-k="bm"][aria-pressed="true"] { color: var(--accent); & svg { fill: currentColor; } }
    &.pop svg { animation: pop .3s ease-out; }
  }
  & .group { display: inline-flex; gap: 0; }
}
@keyframes pop { 40% { scale: 1.35; } }

/* retweet menu (Shift+click): Popover API */
[popover].menu {
  margin: 0; inset: auto; position: fixed; padding: 4px 0; min-width: 180px;
  border: 0; border-radius: 12px; background: var(--bg-elev); color: var(--text); box-shadow: var(--shadow);
  & button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; font-weight: 700; &:hover { background: var(--bg-2); } }
}

/* ---------- thread / detail view ---------- */
.focal {
  padding: 12px 16px 0; border-bottom: 1px solid var(--line);
  & .who { display: flex; align-items: center; gap: 12px;
    & .names { min-width: 0; line-height: 20px; & b { display: flex; align-items: center; gap: 4px; } & span { color: var(--muted); } }
    & .follow { margin-left: auto; } }
  & .text { font-size: 17px; line-height: 24px; margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  & .when { color: var(--muted); padding: 16px 0; border-bottom: 1px solid var(--line); & b { color: var(--text); } }
  & .counts { display: flex; flex-wrap: wrap; gap: 4px 20px; padding: 16px 0; border-bottom: 1px solid var(--line); color: var(--muted); & b { color: var(--text); } }
  & .actions { margin: 4px -8px; padding: 0; max-width: none; justify-content: space-around; }
}
.composer {
  display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
  & input { border: 0; background: none; color: var(--text); font: 20px/24px var(--font); outline: none; min-width: 0; &::placeholder { color: var(--muted); } }
}
.btn {
  padding: 0 16px; height: 36px; border-radius: 999px; font-weight: 700; font-size: 15px;
  background: var(--text); color: var(--bg);
  &:hover { opacity: .9; }
  &.ghost { background: none; color: var(--text); border: 1px solid var(--line); }
  &.blue { background: var(--accent); color: #fff; }
  &[disabled] { opacity: .5; cursor: default; }
}
.thread-line { position: relative;
  &::before { content: ""; position: absolute; left: 35px; top: 56px; bottom: -4px; width: 2px; background: var(--line); }
  & .tweet { border-bottom: 0; }
}

/* ---------- right sidebar ---------- */
.side {
  position: sticky; top: var(--topbar);
  align-self: start;
  padding: 0 0 24px 30px; width: 350px;
  scrollbar-width: none;
  & .search {
    position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 6px 0 10px;
    & label { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); color: var(--muted);
      &:focus-within { border-color: var(--accent); background: var(--bg); & svg { color: var(--accent); } } }
    & input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: 15px var(--font); &::placeholder { color: var(--muted); } }
  }
  & .card {
    border: 1px solid var(--line); border-radius: var(--radius); margin-top: 6px; margin-bottom: 16px; overflow: hidden;
    & h2 { margin: 0; padding: 12px 16px; font-size: 20px; line-height: 24px; }
    & .row { display: block; padding: 12px 16px; color: var(--text); text-decoration: none; cursor: pointer; &:hover { background: var(--bg-hover); } }
    & .trend { & small { display: block; color: var(--muted); font-size: 13px; line-height: 16px; } & b { display: block; margin: 2px 0; } }
    & .wtf { display: flex; align-items: center; gap: 12px;
      & .names { flex: 1; min-width: 0; line-height: 20px; & b, & span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } & b { display: flex; align-items: center; gap: 4px; } & span { color: var(--muted); } }
      & .btn { height: 32px; font-size: 14px; } }
    & .all { display: block; padding: 16px; color: var(--accent); }
  }
  & .foot { color: var(--muted); font-size: 13px; line-height: 18px; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 4px 12px;
    & a { color: inherit; } & .bb { flex-basis: 100%; margin-top: 6px; display: flex; align-items: center; gap: 6px; & svg { color: var(--accent); } } }
}

/* ---------- lightbox: native <dialog> ---------- */
dialog.lightbox {
  position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0;
  background: rgb(0 0 0 / .9); color: #fff; overflow: hidden;
  &::backdrop { background: rgb(0 0 0 / .6); }
  &[open] { display: grid; grid-template: 1fr auto / 1fr; animation: fade .18s ease-out; }
  & figure { margin: 0; min-height: 0; display: grid; place-items: center; padding: 56px 72px 8px;
    & img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: 0 8px 40px rgb(0 0 0 / .5); } }
  & .cap { padding: 8px 16px 16px; text-align: center; color: #ccc; font-size: 14px; & b { color: #fff; margin-right: 8px; } }
  & .lb-btn { position: absolute; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .1); color: #fff;
    &:hover { background: rgb(255 255 255 / .2); } &[hidden] { display: none; } & svg { width: 22px; height: 22px; } }
  & .x { top: 12px; left: 12px; }
  & .prev { left: 16px; top: 50%; translate: 0 -50%; }
  & .next { right: 16px; top: 50%; translate: 0 -50%; }
  & .count { position: absolute; top: 22px; right: 20px; font-weight: 700; font-size: 14px; }
}
@keyframes fade { from { opacity: 0; } }

/* compose dialog */
dialog.compose {
  width: min(600px, calc(100vw - 32px)); padding: 0; border: 0; border-radius: var(--radius);
  background: var(--bg); color: var(--text); box-shadow: var(--shadow);
  &::backdrop { background: rgb(91 112 131 / .4); }
  & .top { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
    & .x { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; &:hover { background: var(--bg-2); } } }
  & .ed { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 4px 16px 0; }
  & textarea { resize: none; border: 0; outline: 0; background: none; color: var(--text); font: 20px/26px var(--font); min-height: 120px; &::placeholder { color: var(--muted); } }

    & .left { color: var(--muted); font-size: 13px; margin-right: auto; font-variant-numeric: tabular-nums; } }
}

/* toast */
.toast {
  position: fixed; left: 50%; bottom: 28px; translate: -50% 0; z-index: 60;
  padding: 12px 18px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600;

}

      text: 'Long thought on why our city keeps building the wrong kind of bike lanes.\n\nPaint is not infrastructure. A painted line next to a 50 km/h road is a suggestion, and everyone on a bike knows it. The cities that actually got people cycling did three boring things, in this order: they slowed the cars, they separated the lanes with something you can not drive through, and they connected the network so that a lane does not just end at the worst junction in town.\n\nThe third one is the one we keep skipping. A lane that stops two blocks before the school is not 80% of a lane; it is 0% of a route. Parents do the maths, and the maths says drive.\n\nSo here is my ask for next year\'s budget: fewer new kilometres, more finished connections. Map the five junctions where lanes die, fix those first, and measure who starts riding. I will bet you a coffee it is kids and people over 60, the two groups paint never reached.',

  const rich = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/(^|[\s(])([@#][\w]+)/g, (m, pre, tok) => `${pre}<a href="#" data-tok="${tok}">${tok}</a>`)
    .replace(/\b([a-z0-9-]+\.example\/[\w/-]*)/gi, '<a href="#">$1</a>');

  // ---------- render pieces ----------
  function mediaHtml(media, tid) {
    const n = Math.min(media.length, 4);
    return `<div class="media n${n}">${media.slice(0, 4).map((m, i) =>
      `<button class="ph" data-lb-open="${tid}" data-i="${i}" aria-label="Open photo ${i + 1} of ${n}"${n === 1 ? ` style="aspect-ratio:${m.w}/${m.h}"` : ''}>
        <img src="${m.src}" alt="${esc(m.alt)}" width="${m.w}" height="${m.h}" loading="lazy" decoding="async">${m.alt ? '<span class="alt">ALT</span>' : ''}</button>`).join('')}</div>`;
  }
  function videoHtml(v, tid) {
    return `<div class="vid" data-vid="${tid}" style="--poster:url('${v.poster}')">
      <span class="audio" data-on="false">${icon('mute')}<span class="lvl">Muted</span><span class="meter"><i></i><i></i><i></i><i></i></span></span>
      <button class="start" aria-label="Play video"><span>${icon('play', 'i fill')}</span></button>
      <span class="dur">${esc(v.dur)}</span>
    </div>`;
  }
  function pollHtml(p, tid) {
    const max = Math.max(...p.opts.map(o => o[1]));
    return `<div class="poll" data-poll="${tid}">${p.opts.map(([label, pct], i) =>
      `<button class="opt${pct === max ? ' win' : ''}" style="--p:0%" data-p="${pct}" data-i="${i}"><span>${esc(label)}</span><span class="pc" hidden>${pct}%</span></button>`).join('')}
      <div class="meta">${p.votes.toLocaleString('en-US')} votes · ${esc(p.left)}</div></div>`;
  }
  function noteHtml(n) {
    return `<div class="cnote"><header>${icon('note')}Readers added context they thought people might want to know</header>
      <p>${rich(n.text)} <a href="#">${esc(n.link)}</a></p>
      <footer><span>Do you find this helpful?</span><button type="button">Rate it</button></footer></div>`;
  }
  function quoteHtml(q) {
    return `<div class="quote" data-open="${q.id}">
      <div class="head">${av(q.by, 'sm')}<span class="name">${esc(q.by.name)}</span>${badge(q.by.v)}<span class="handle">@${esc(q.by.handle)}</span><span class="dot">·</span><time>${esc(q.time)}</time></div>
      <div class="text">${rich(q.text.split('\n\n')[0])}</div></div>`;
  }
  function actionsHtml(t, big) {
    const a = (k, label, n, pressed) => `<button class="act" data-k="${k}" data-id="${t.id}" aria-label="${label}"${pressed !== undefined ? ` aria-pressed="${pressed}"` : ''} title="${label}"><span class="ic">${icon(k)}</span>${big || n === undefined ? '' : `<span class="n">${num(n)}</span>`}</button>`;
    return `<div class="actions">
      ${a('reply', 'Reply', t.c.reply)}
      ${a('rt', 'Retweet (one click; Shift+click for Quote)', t.c.rt + (t.me.rt ? 1 : 0), t.me.rt)}
      ${a('like', 'Like', t.c.like + (t.me.like ? 1 : 0), t.me.like)}
      ${big ? '' : a('views', 'Views', t.c.view)}
      <span class="group">
        ${a('lrt', 'Like + Retweet', undefined, t.me.like && t.me.rt)}
        ${a('bm', 'Bookmark', undefined, t.me.bm)}
        ${a('copy', 'Copy vxtwitter link (Discord embed)')}
      </span></div>`;
  }
  function extras(t) {
    return (t.media ? mediaHtml(t.media, t.id) : '') + (t.video ? videoHtml(t.video, t.id) : '') +
      (t.quoted ? quoteHtml(t.quoted) : '') + (t.poll ? pollHtml(t.poll, t.id) : '') + (t.cnote ? noteHtml(t.cnote) : '');
  }
  function tweetHtml(t, { replyTo } = {}) {
    return `<article class="tweet" tabindex="0" data-open="${t.id}" aria-label="${esc(t.by.name)}: ${esc(t.text.slice(0, 80))}">
      ${t.rtBy ? `<div class="ctx">${icon('rt')}<span>${esc(t.rtBy.name)} reposted</span></div>` : ''}
      ${av(t.by)}
      <div class="body">
        <div class="head"><a class="name" href="#" data-tok="@${esc(t.by.handle)}">${esc(t.by.name)}</a>${badge(t.by.v)}<span class="handle">@${esc(t.by.handle)}</span><span class="dot">·</span><time>${esc(t.time)}</time>
          <button class="more" aria-label="More">${icon('more')}</button></div>
        ${replyTo ? `<div class="reply-to">Replying to <a href="#">@${esc(replyTo.handle)}</a></div>` : ''}
        <div class="text${t.note ? ' clamp' : ''}">${rich(t.text)}</div>
        ${t.note ? '<button class="show-more" data-more>Show more</button>' : ''}
        ${extras(t)}
        ${actionsHtml(t)}
      </div></article>`;
  }

  // ---------- views ----------
  const feed = $('#feed'), thread = $('#thread'), homeView = $('#home-view'), threadView = $('#thread-view');
  const renderFeed = list => { feed.innerHTML = list.map(t => tweetHtml(t)).join(''); bindVideos(feed); };
  renderFeed(T);

  $('#trends').innerHTML = TRENDS.map(([ctx, title, n]) => `<a class="row trend" href="#"><small>${esc(ctx)}</small><b>${esc(title)}</b><small>${esc(n)}</small></a>`).join('');
  $('#wtf').innerHTML = WTF.map(u => `<div class="row wtf">${av(u)}<span class="names"><b>${esc(u.name)}${badge(u.v)}</b><span>@${esc(u.handle)}</span></span><button class="btn" data-follow>Follow</button></div>`).join('');

  let homeScroll = 0;
  function openThread(id, push = true) {
    const t = byId.get(id); if (!t) return;
    destroyVideos(feed);
    homeScroll = scrollY;
    thread.innerHTML = `
      <div class="focal" data-focal="${t.id}">
        <div class="who">${av(t.by, 'lg')}<span class="names"><b>${esc(t.by.name)}${badge(t.by.v)}</b><span>@${esc(t.by.handle)}</span></span><button class="btn ghost follow" data-follow>Follow</button></div>
        <div class="text">${rich(t.text)}</div>
        ${extras(t)}
        <div class="when">${esc(t.date)} · <b>${num(t.c.view)}</b> Views</div>
        <div class="counts"><span><b>${num(t.c.rt + (t.me.rt ? 1 : 0))}</b> Reposts</span><span><b>${num(Math.round(t.c.rt / 7))}</b> Quotes</span><span><b>${num(t.c.like + (t.me.like ? 1 : 0))}</b> Likes</span><span><b>${num(t.c.bm)}</b> Bookmarks</span></div>
        ${actionsHtml(t, true)}
      </div>
      <div class="composer"><span class="av" style="--h:200" aria-hidden="true">YO</span><input placeholder="Post your reply" aria-label="Post your reply"><button class="btn blue" disabled>Reply</button></div>
      ${REPLIES.map(([u, time, text], i) => tweetHtml({ id: t.id + 'r' + i, by: u, time, text, c: { reply: i * 3 + 1, rt: i * 2, like: 12 + i * 31, view: 900 + i * 400 }, me: { like: false, rt: false, bm: false } }, { replyTo: t.by })).join('')}`;
    homeView.hidden = true; threadView.hidden = false;
    bindVideos(thread);
    scrollTo(0, 0);
    if (push) history.pushState({ view: 'thread', id }, '', '#/' + t.by.handle + '/status/' + id);
    $('#stat').textContent = '⚡ thread from cache · 0 extra requests';
    $('.focal .text')?.focus?.();
  }
  function showHome(push = true) {
    destroyVideos(thread);
    threadView.hidden = true; homeView.hidden = false; thread.innerHTML = '';
    renderFeed(T);
    scrollTo(0, homeScroll);
    if (push) history.pushState({ view: 'home' }, '', '#/home');
    $('#stat').textContent = '⚡ 10 posts · 0 extra requests';
  }
  history.replaceState({ view: 'home' }, '', location.pathname + location.search + '#/home');
  addEventListener('popstate', e => {
    if ($('#lightbox').open) { $('#lightbox').close(); return; }
    const st = e.state || { view: 'home' };
    if (st.view === 'thread') openThread(st.id, false); else showHome(false);
  });
  $('#back').addEventListener('click', () => history.back());

  // ---------- toast ----------
  let toastT = 0;
  function toast(msg) {
    const el = $('#toast'); el.textContent = msg; el.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600);
  }

  // ---------- actions (optimistic, like the real thing) ----------
  function refreshActions(t) {
    $$(`.act[data-id="${t.id}"]`).forEach(b => {
      const k = b.dataset.k, n = b.querySelector('.n');
      if (k === 'like') { b.setAttribute('aria-pressed', t.me.like); if (n) n.textContent = num(t.c.like + (t.me.like ? 1 : 0)); }
      if (k === 'rt') { b.setAttribute('aria-pressed', t.me.rt); if (n) n.textContent = num(t.c.rt + (t.me.rt ? 1 : 0)); }
      if (k === 'lrt') b.setAttribute('aria-pressed', t.me.like && t.me.rt);
      if (k === 'bm') b.setAttribute('aria-pressed', t.me.bm);
    });
    const counts = $(`.focal[data-focal="${t.id}"] .counts`);
    if (counts) { const b = counts.querySelectorAll('b'); b[0].textContent = num(t.c.rt + (t.me.rt ? 1 : 0)); b[2].textContent = num(t.c.like + (t.me.like ? 1 : 0)); }
  }
  const pop = b => { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); };
  let menuFor = null;
  function act(btn, e) {
    const t = byId.get(btn.dataset.id);
    const k = btn.dataset.k;
    if (k === 'copy') {
      const url = `https://vxtwitter.com/${(t || { by: U.sam }).by.handle}/status/${btn.dataset.id.replace(/r\d+$/, '')}`;
      (navigator.clipboard?.writeText(url) || Promise.reject()).then(() => toast('Copied ' + url), () => toast('Link: ' + url));
      return;
    }
    if (k === 'reply') { openCompose(t ? '@' + t.by.handle + ' ' : ''); return; }
    if (k === 'views') return;
    if (!t) { toast('Sample reply: actions work on the main posts'); return; }
    if (k === 'rt' && e.shiftKey) {
      const m = $('#rt-menu'), r = btn.getBoundingClientRect();
      menuFor = t;
      m.style.left = Math.min(r.left, innerWidth - 200) + 'px'; m.style.top = (r.bottom + 4) + 'px';
      m.showPopover?.();
      return;
    }
    if (k === 'like') t.me.like = !t.me.like;
    if (k === 'rt') { t.me.rt = !t.me.rt; toast(t.me.rt ? 'Reposted (one click, no menu)' : 'Repost undone'); }
    if (k === 'bm') { t.me.bm = !t.me.bm; toast(t.me.bm ? 'Added to Bookmarks' : 'Removed from Bookmarks'); }
    if (k === 'lrt') {
      const both = t.me.like && t.me.rt;
      t.me.like = t.me.rt = !both;
      toast(both ? 'Like and repost undone' : 'Liked and reposted');
    }
    refreshActions(t); pop(btn);
  }
  $('#rt-menu').addEventListener('click', e => {
    const b = e.target.closest('[data-menu]'); if (!b || !menuFor) return;
    $('#rt-menu').hidePopover();
    if (b.dataset.menu === 'repost') { menuFor.me.rt = !menuFor.me.rt; refreshActions(menuFor); toast(menuFor.me.rt ? 'Reposted' : 'Repost undone'); }
    else openCompose('', menuFor);
  });

  // ---------- lightbox: <dialog> ----------
  const lb = $('#lightbox');
  let lbList = [], lbI = 0;
  function lbShow() {
    const m = lbList[lbI];
    let img = $('#lb-img');
    if (!img) { img = document.createElement('img'); img.id = 'lb-img'; $('#lb-fig').append(img); }
    img.src = m.src; img.alt = m.alt || '';
    $('#lb-count').textContent = lbList.length > 1 ? `${lbI + 1} / ${lbList.length}` : '';
    $('#lb-cap').innerHTML = m.alt ? `<b>ALT</b>${esc(m.alt)}` : '';
    $('[data-lb="prev"]', lb).hidden = lbI === 0;
    $('[data-lb="next"]', lb).hidden = lbI >= lbList.length - 1;
  }
  function openLightbox(id, i) {
    const t = byId.get(id); if (!t?.media) return;
    lbList = t.media; lbI = i; lbShow();
    lb.showModal();
    history.pushState({ ...(history.state || {}), lb: 1 }, '', location.hash);   // Back closes it
  }
  const lbStep = d => { const n = lbI + d; if (n >= 0 && n < lbList.length) { lbI = n; lbShow(); } };
  lb.addEventListener('click', e => {
    const b = e.target.closest('[data-lb]');
    if (b) { b.dataset.lb === 'close' ? lb.close() : lbStep(b.dataset.lb === 'next' ? 1 : -1); return; }
    if (e.target === lb || e.target.tagName === 'FIGURE') lb.close();
  });
  lb.addEventListener('keydown', e => { if (e.key === 'ArrowRight') lbStep(1); if (e.key === 'ArrowLeft') lbStep(-1); });
  lb.addEventListener('close', () => { if (history.state?.lb) history.back(); });

  // ---------- compose: <dialog> ----------
  const cd = $('#compose'), ct = $('#compose-text');
  function openCompose(prefill = '', quote) {
    ct.value = prefill; ct.placeholder = quote ? 'Add a comment' : 'What is happening?!';
    syncCompose(); cd.showModal(); ct.focus(); ct.setSelectionRange(ct.value.length, ct.value.length);
  }
  function syncCompose() { $('#compose-count').textContent = `${ct.value.length} / 280`; $('#compose-post').disabled = !ct.value.trim(); }
  ct.addEventListener('input', syncCompose);
  cd.addEventListener('close', () => { if (cd.returnValue === 'post') toast('Posted (mock: nothing was sent)'); });
  cd.addEventListener('click', e => { if (e.target === cd) cd.close(); });
  $('#compose-btn').addEventListener('click', () => openCompose());

  // ---------- video: native <video> + generated sound, one at a time ----------
  // The real build plays X's mp4 variant (it carries audio). Here a canvas + WebAudio stream stands in,
  // so the mock has a real <video> with real browser controls and real sound, and no files.
  const live = new Set();
  function bindVideos(root) { $$('.vid .start', root).forEach(b => b.addEventListener('click', () => startVideo(b.closest('.vid')), { once: true })); }
  function startVideo(box) {
    live.forEach(o => { if (o.v !== box.querySelector('video')) o.v.pause(); });   // one plays at a time
    const W = 640, H = 360, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    const poster = new Image(); poster.src = getComputedStyle(box).getPropertyValue('--poster').slice(5, -2).replace(/^["']|["']$/g, '');
    let ac = null, an = null, stream = cv.captureStream ? cv.captureStream(30) : null;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const dest = ac.createMediaStreamDestination(), master = ac.createGain(); master.gain.value = 0.18;
      [110, 164.8, 220.5].forEach((f, i) => {
        const o = ac.createOscillator(), og = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
        o.type = i ? 'sine' : 'triangle'; o.frequency.value = f; og.gain.value = 0.3 / (i + 1);
        lfo.frequency.value = 0.08 + i * 0.05; lg.gain.value = 0.2 / (i + 1); lfo.connect(lg).connect(og.gain);
        o.connect(og).connect(master); o.start(); lfo.start();
      });
      an = ac.createAnalyser(); an.fftSize = 64; master.connect(an); master.connect(dest);
      if (stream) dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
    } catch {}
    const v = document.createElement('video');
    v.controls = true; v.playsInline = true; v.volume = 0.4;
    if (stream) v.srcObject = stream;
    box.querySelector('.start').remove();
    box.querySelector('.dur').remove();
    box.prepend(v);
    const pill = box.querySelector('.audio'), bars = [...pill.querySelectorAll('.meter i')];
    const syncPill = () => {
      const on = !v.muted && v.volume > 0;
      pill.dataset.on = on;
      pill.querySelector('svg').outerHTML = icon(on ? 'vol' : 'mute');
      pill.querySelector('.lvl').textContent = on ? `Sound on · ${Math.round(v.volume * 100)}%` : 'Muted';
    };
    v.addEventListener('volumechange', syncPill); syncPill();
    const data = new Uint8Array(32), t0 = performance.now();
    const o = { v, ac, raf: 0 };
    const frame = now => {
      const t = (now - t0) / 1000;
      if (poster.complete && poster.naturalWidth) {
        const z = 1.08 + Math.sin(t / 6) * 0.04, dx = Math.sin(t / 9) * 24;
        g.drawImage(poster, -W * (z - 1) / 2 + dx, -H * (z - 1) / 2, W * z, H * z);
      } else { g.fillStyle = '#123'; g.fillRect(0, 0, W, H); }
      for (let i = 0; i < 5; i++) {   // drifting cloud bands
        const y = H * 0.3 + i * 26 + Math.sin(t * 0.7 + i) * 6, x = ((t * (18 + i * 6) + i * 140) % (W + 400)) - 200;
        const gr = g.createRadialGradient(x, y, 4, x, y, 160); gr.addColorStop(0, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gr; g.fillRect(x - 170, y - 60, 340, 120);
      }
      g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(W - 92, 12, 80, 22);
      g.fillStyle = '#fff'; g.font = '600 13px system-ui, sans-serif'; g.fillText(`0:${String(Math.floor(t) % 90).padStart(2, '0')} / 1:30`, W - 84, 28);
      if (an && !v.paused) { an.getByteFrequencyData(data); bars.forEach((b, i) => { b.style.height = (20 + data[i * 3 + 1] / 255 * 80) + '%'; }); }
      o.raf = requestAnimationFrame(frame);
    };
    o.raf = requestAnimationFrame(frame);
    v.addEventListener('play', () => { live.forEach(x => { if (x !== o) x.v.pause(); }); ac?.resume(); });
    v.addEventListener('pause', () => ac?.suspend());
    live.add(o);
    v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });   // a refused audible start retries muted
  }
  function destroyVideos(root) {
    live.forEach(o => { if (root.contains(o.v)) { cancelAnimationFrame(o.raf); o.v.pause(); o.v.srcObject?.getTracks().forEach(t => t.stop()); o.ac?.close(); live.delete(o); } });
  }
  // Pause when the tab is hidden (videoPauseOnHide)
  document.addEventListener('visibilitychange', () => { if (document.hidden) live.forEach(o => o.v.pause()); });

  // ---------- polls ----------
  function vote(btn) {
    const poll = btn.closest('.poll'); if (poll.classList.contains('voted')) return;
    poll.classList.add('voted');
    $$('.opt', poll).forEach(o => {
      o.querySelector('.pc').hidden = false;
      if (o === btn) o.querySelector('span').insertAdjacentHTML('beforeend', ' <span class="pick">✓</span>');
      requestAnimationFrame(() => { o.style.setProperty('--p', o.dataset.p + '%'); });
    });
    poll.querySelector('.meta').textContent = poll.querySelector('.meta').textContent.replace(/[\d,]+ votes/, m => (parseInt(m.replace(/,/g, ''), 10) + 1).toLocaleString('en-US') + ' votes');
  }

  // ---------- one delegated click handler for the whole UI ----------
  document.addEventListener('click', e => {
    const t = e.target;
    const actBtn = t.closest('.act'); if (actBtn) { e.stopPropagation(); act(actBtn, e); return; }
    const ph = t.closest('[data-lb-open]'); if (ph) { openLightbox(ph.dataset.lbOpen, +ph.dataset.i); return; }
    const opt = t.closest('.poll .opt'); if (opt) { vote(opt); return; }
    const more = t.closest('[data-more]'); if (more) { const tx = more.previousElementSibling; const open = tx.classList.toggle('clamp'); more.textContent = open ? 'Show more' : 'Show less'; return; }
    const fol = t.closest('[data-follow]'); if (fol) { const on = fol.textContent === 'Follow'; fol.textContent = on ? 'Following' : 'Follow'; fol.classList.toggle('ghost', on); return; }
    const tok = t.closest('[data-tok]'); if (tok) { e.preventDefault(); toast((tok.dataset.tok[0] === '#' ? 'Search ' : 'Profile ') + tok.dataset.tok + ' (Fast UI route)'); return; }
    const nav = t.closest('[data-nav]');
    if (nav) {
      e.preventDefault();
      if (nav.dataset.nav === 'home') { if (!threadView.hidden) history.back(); else scrollTo({ top: 0, behavior: 'smooth' }); return; }
      if (nav.dataset.nav === 'native') { toast(`${nav.dataset.route} is X's own page: handed to native X`); return; }
      toast(nav.textContent.trim() + ': Fast UI route (M3)'); return;
    }
    const tab = t.closest('[data-tab]');
    if (tab) { $$('[data-tab]').forEach(b => b.setAttribute('aria-selected', b === tab)); renderFeed(tab.dataset.tab === 'following' ? T.filter((_, i) => i % 2 === 0) : T); return; }
    if (t.closest('#new-pill')) { $('#new-pill').remove(); scrollTo({ top: 0, behavior: 'smooth' }); toast('3 new posts (mock)'); return; }
    if (t.closest('a, button, video, .vid, .cnote, input, textarea')) return;
    const open = t.closest('[data-open]');
    if (open && !threadView.contains(open) || open?.classList.contains('quote')) openThread(open.dataset.open.replace(/r\d+$/, ''));
  });

  // ---------- theme switcher ----------
  function setTheme(th) {
    document.documentElement.dataset.theme = th;
    $$('[data-theme-btn]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeBtn === th));
    store.set('xbb-fast-mock-theme', th);
  }
  $$('[data-theme-btn]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.themeBtn)));
  const saved = store.get('xbb-fast-mock-theme'); if (saved && /^(black|dim|light)$/.test(saved)) setTheme(saved);

  // ---------- native escape hatch ----------
  $('#native').addEventListener('click', () => toast('Native X: this route goes back to X\'s own page (Alt+Shift+X). "Fast UI" in X\'s sidebar returns.'));

  // ---------- keyboard: j/k, l, t, b, Enter, Esc, Alt+Shift+X ----------
  document.addEventListener('keydown', e => {
    if (e.altKey && e.shiftKey && e.code === 'KeyX') { e.preventDefault(); $('#native').click(); return; }
    if (e.target.closest('input, textarea, dialog') || e.ctrlKey || e.metaKey || e.altKey) return;
    const list = $$('article.tweet').filter(a => !a.closest('[hidden]'));
    const cur = document.activeElement?.closest?.('article.tweet');
    const i = list.indexOf(cur);
    const go = n => { const el = list[Math.max(0, Math.min(list.length - 1, n))]; if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } };
    const press = k => cur && cur.querySelector(`.act[data-k="${k}"]`)?.click();
    switch (e.key) {
      case 'j': go(i + 1); break;
      case 'k': go(i < 0 ? 0 : i - 1); break;
      case 'l': press('like'); break;
      case 't': press('rt'); break;
      case 'b': press('bm'); break;
      case 'Enter': if (cur && !threadView.contains(cur)) openThread(cur.dataset.open); break;
      case 'Escape': if (!threadView.hidden) history.back(); break;
      default: return;
    }
    e.preventDefault();
  });
})();
</script>
</body>
</html>
