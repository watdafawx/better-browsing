<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinterest Fast UI mock</title>
<!--
  Visual + behavioural target for pinterest/FAST-UI-PLAN.md. Not shipped. One file, no dependencies.
  What is real here, the way the plan specifies it:
    - masonry: exact (col, x, y, w, h) from each pin's width/height before paint, shortest column first,
      per-column sorted arrays + binary search for the visible window, <= 50 mounted cards, node pool,
      translate3d, contain: layout style paint, resize keeps the top-visible pin under the eye
    - paging: 80 pins per "bookmark", promoted pins dropped at the data level before layout
    - overlay: native <dialog> lightbox with stage, zoom, stepping, idea-pin pages, video player,
      side panel, comments, related pins (same engine), save-to-board picker; Esc returns to the exact pixel
  Art is CSS gradients made from a seeded RNG, so the file needs no images. No vh/vw/dvh units anywhere.
-->
<style>
:root{
  --bg:#ffffff; --bg2:#f1f1f1; --bg3:#e9e9e9; --fg:#111111; --fg2:#5f5f5f; --fg3:#6b6b6b;
  --line:#e4e4e4; --card:#efefef; --accent:#e60023; --accent-h:#c8001e; --on-accent:#ffffff;
  --overlay:rgba(0,0,0,.55); --shadow:0 8px 28px rgba(0,0,0,.16); --hud:rgba(17,17,17,.86); --hud-fg:#f4f4f4;
  --radius:16px; --rail:72px; --gap:16px; --foot:44px; --pad:24px;
  color-scheme:light;
}
:root[data-theme="dim"]{
  --bg:#15181c; --bg2:#22262c; --bg3:#2b3037; --fg:#e8eaed; --fg2:#a0a6ad; --fg3:#8d939a;
  --line:#2b3037; --card:#1e2227; --overlay:rgba(0,0,0,.7); --shadow:0 8px 28px rgba(0,0,0,.5);
  --hud:rgba(34,38,44,.92); color-scheme:dark;
}
:root[data-theme="black"]{
  --bg:#000000; --bg2:#141516; --bg3:#1d1f21; --fg:#e8eaed; --fg2:#8f959b; --fg3:#80868b;
  --line:#1d1f21; --card:#0d0e0f; --overlay:rgba(0,0,0,.8); --shadow:0 8px 28px rgba(0,0,0,.7);
  --hud:rgba(20,21,22,.94); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
html.lock{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block}

/* ---- rail ---- */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--bg);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;z-index:20}
.mark{width:40px;height:40px;border-radius:12px;background:var(--fg);color:var(--bg);display:grid;place-items:center;
  font-weight:800;font-size:15px;letter-spacing:-.5px;margin-bottom:10px}
.rbtn{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--fg2);position:relative}
.rbtn:hover{background:var(--bg2);color:var(--fg)}
.rbtn.on{background:var(--fg);color:var(--bg)}
.rbtn svg{width:24px;height:24px}
.rbtn .tip{position:absolute;left:58px;background:var(--hud);color:var(--hud-fg);font-size:12px;padding:4px 8px;border-radius:8px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.rbtn:hover .tip{opacity:1}
.rail .spacer{flex:1}

/* ---- top bar ---- */
.main{margin-left:var(--rail)}
.top{position:sticky;top:0;z-index:15;background:var(--bg);padding:12px var(--pad) 10px;display:flex;flex-wrap:wrap;
  align-items:center;gap:10px 12px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.search{flex:1 1 320px;min-width:200px;height:46px;border-radius:999px;background:var(--bg2);display:flex;align-items:center;
  gap:10px;padding:0 16px;color:var(--fg2)}
.search:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 25%,transparent)}
.search input{flex:1;border:0;background:none;outline:0;height:100%;min-width:0;font-size:15px;color:var(--fg)}
.search input::placeholder{color:var(--fg3)}
.search kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--fg3)}
.seg{display:flex;background:var(--bg2);border-radius:999px;padding:4px;gap:2px}
.seg button{height:34px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--fg2);display:flex;align-items:center;gap:6px}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.native{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:13px;display:flex;
  align-items:center;gap:8px;color:var(--fg)}
.native:hover{background:var(--bg2)}
.native svg{width:16px;height:16px}
.chips{flex:1 0 100%;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--bg2);font-weight:600;font-size:13px;
  display:flex;align-items:center;gap:6px;color:var(--fg)}
.chip:hover{background:var(--bg3)}
.chip.on{background:var(--fg);color:var(--bg)}
.chip .n{font-weight:500;opacity:.6;font-size:12px}
.chips .sep{flex:none;width:1px;background:var(--line);margin:6px 4px}
.ctx{flex:1 0 100%;font-size:13px;color:var(--fg2);display:none}
.ctx.show{display:block}

/* ---- grid ---- */
.feed{padding:8px var(--pad) 120px}
#gridWrap{width:100%}
#grid{position:relative;margin:0 auto;contain:layout size;overflow-anchor:none}
.card{position:absolute;left:0;top:0;contain:layout style paint;will-change:transform;cursor:zoom-in;user-select:none}
.media{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--card)}
.art,.st-art{position:absolute;inset:0;background-color:var(--card)}
.glyph{position:absolute;inset:0;display:grid;place-items:center;font:900 58cqw/1 Georgia,"Times New Roman",serif;
  letter-spacing:-.04em;pointer-events:none}
.media{container-type:inline-size}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 34%,transparent 70%,rgba(0,0,0,.28));
  opacity:0;transition:opacity .12s}
.card:hover .shade,.card.picking .shade{opacity:1}
.save,.bchip,.badge,.ad{position:absolute;z-index:1}
.save{top:10px;right:10px;height:38px;padding:0 16px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;
  font-size:14px;opacity:0;transform:translateY(-3px);transition:opacity .12s,transform .12s}
.save:hover{background:var(--accent-h)}
.card:hover .save,.card.picking .save,.card.saved .save{opacity:1;transform:none}
.card.saved .save{background:#111;color:#fff}
.bchip{top:12px;left:10px;height:34px;max-width:calc(100% - 110px);padding:0 10px 0 12px;border-radius:999px;background:rgba(255,255,255,.94);
  color:#111;font-weight:600;font-size:13px;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .12s}
.bchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bchip svg{width:14px;height:14px;flex:none}
.card:hover .bchip,.card.picking .bchip{opacity:1}
.badge{left:10px;bottom:10px;height:26px;padding:0 9px;border-radius:999px;background:rgba(0,0,0,.66);color:#fff;font-size:12px;
  font-weight:700;display:none;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.badge.show{display:flex}
.badge svg{width:11px;height:11px}
.foot{height:var(--foot);padding:6px 4px 0;overflow:hidden}
.foot .t{font-weight:650;font-size:13.5px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .by{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);line-height:16px;margin-top:2px;white-space:nowrap;overflow:hidden}
.av{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
.loading{position:absolute;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--fg2);font-size:13px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--fg);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- HUD ---- */
.hud{position:fixed;left:calc(var(--rail) + 14px);bottom:14px;z-index:30;background:var(--hud);color:var(--hud-fg);border-radius:14px;
  padding:9px 12px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow);max-width:calc(100% - var(--rail) - 28px);flex-wrap:wrap}
.hud b{color:#fff;font-weight:700}
.hud .ok{color:#7ee2a8}
.hud button{font:600 11px system-ui,sans-serif;background:rgba(255,255,255,.14);border-radius:8px;padding:4px 8px;color:#fff}
.hud button:hover{background:rgba(255,255,255,.24)}
.hud.min .stat{display:none}

/* ---- toast ---- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:12px 18px;
  border-radius:14px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:60;
  box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast u{text-decoration:none;opacity:.7;font-weight:700;cursor:pointer}

/* ---- board picker ---- */
.picker{position:fixed;z-index:70;width:320px;max-width:calc(100% - 24px);background:var(--bg);color:var(--fg);border-radius:20px;
  box-shadow:0 12px 40px rgba(0,0,0,.28);border:1px solid var(--line);padding:14px;display:none}
.picker.show{display:block}
.picker h4{margin:2px 4px 10px;font-size:15px;text-align:center}
.pk-search{height:40px;border-radius:999px;background:var(--bg2);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--fg2)}
.pk-search input{flex:1;border:0;background:none;outline:0;min-width:0;color:var(--fg)}
.pk-list{max-height:260px;overflow:auto;margin:10px -6px 0;padding:0 6px}
.pk-h{font-size:12px;color:var(--fg2);margin:10px 6px 4px;font-weight:600}
.pk-row{display:flex;align-items:center;gap:10px;width:100%;padding:7px 6px;border-radius:12px;text-align:left}
.pk-row:hover,.pk-row.kf{background:var(--bg2)}
.pk-row .cov{width:40px;height:40px;border-radius:10px;flex:none}
.pk-row .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-row .nm small{display:block;font-weight:400;color:var(--fg2);font-size:12px}
.pk-row .go{background:var(--accent);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;opacity:0}
.pk-row:hover .go,.pk-row.kf .go{opacity:1}
.pk-lock{width:14px;height:14px;color:var(--fg2)}
.pk-create{border-top:1px solid var(--line);margin:10px -14px -14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pk-create .row{display:flex;gap:8px;align-items:center}
.pk-create input[type=text]{flex:1;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;outline:0;min-width:0}
.pk-create input[type=text]:focus{border-color:var(--fg2)}
.pk-create label{font-size:12px;color:var(--fg2);display:flex;align-items:center;gap:6px}
.btn{height:38px;padding:0 16px;border-radius:999px;font-weight:700;background:var(--bg2)}
.btn:hover{background:var(--bg3)}
.btn.red{background:var(--accent);color:#fff}
.btn.red:hover{background:var(--accent-h)}
.btn.dark{background:var(--fg);color:var(--bg)}
.pk-new{display:flex;align-items:center;gap:10px;font-weight:700;padding:4px 0}
.pk-new i{width:40px;height:40px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;font-style:normal;font-size:22px}

/* ---- lightbox ---- */
dialog#lb{border:0;padding:0;background:var(--bg);color:var(--fg);border-radius:24px;width:min(1240px,calc(100% - 48px));
  max-width:none;max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 70px rgba(0,0,0,.4);overscroll-behavior:contain}
dialog#lb::backdrop{background:var(--overlay)}
.lb-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.lb-head .grow{flex:1;min-width:0;font-size:13px;color:var(--fg2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ibtn:hover{background:var(--bg2)}
.ibtn svg{width:20px;height:20px}
.ibtn[hidden]{display:none}
.crumb{font-weight:600;color:var(--fg)}
.lb-body{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0}
.stage{position:relative;height:var(--stageH,640px);background:color-mix(in srgb,var(--bg2) 70%,var(--bg));display:grid;place-items:center;overflow:hidden;
  border-radius:0 0 0 0}
.st-box{position:relative;border-radius:18px;overflow:hidden;cursor:zoom-in;container-type:inline-size}
.st-box.zoomed{cursor:zoom-out}
.st-box .st-art{transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.st-box.zoomed .st-art{transform:scale(2.4)}
.st-box.video{cursor:pointer}
.st-box.story{cursor:pointer}
.st-box .glyph{font-size:58cqw}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:var(--bg);color:var(--fg);
  box-shadow:var(--shadow);display:grid;place-items:center;z-index:3}
.nav:hover{background:var(--bg2)}
.nav svg{width:22px;height:22px}
.nav.prev{left:16px}.nav.next{right:16px}
.nav:disabled{opacity:.3;cursor:default}
.rend{position:absolute;right:12px;bottom:12px;z-index:3;font:600 11px ui-monospace,monospace;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:4px 8px}
.bars{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:4px;z-index:3}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.45)}
.bars i.on{background:#fff}
.pgno{position:absolute;left:12px;top:22px;z-index:3;font-weight:700;font-size:12px;color:#fff;background:rgba(0,0,0,.5);border-radius:999px;padding:3px 9px}
.vbar{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.6));
  color:#fff;display:flex;align-items:center;gap:12px;font:600 12px system-ui,sans-serif;font-variant-numeric:tabular-nums}
.vbar svg{width:18px;height:18px}
.vbar .trk{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.35);position:relative}
.vbar .trk i{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px;width:0}
.bigplay{position:absolute;inset:0;margin:auto;width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:2;color:#fff}
.bigplay svg{width:30px;height:30px}
.side{padding:20px 22px 24px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:14px;min-width:0}
.saverow{display:flex;align-items:center;gap:8px}
.saverow .grow{flex:1}
.bsel{height:44px;padding:0 12px 0 14px;border-radius:999px;background:var(--bg2);font-weight:700;display:flex;align-items:center;gap:6px;max-width:190px}
.bsel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsel svg{width:14px;height:14px;flex:none}
.bigsave{height:44px;padding:0 20px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
.bigsave:hover{background:var(--accent-h)}
.bigsave.done{background:#111}
.side h2{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.01em}
.dom{font-size:13px;color:var(--fg2);text-decoration:underline;text-underline-offset:2px}
.author{display:flex;align-items:center;gap:10px}
.author .av{width:44px;height:44px;font-size:16px}
.author .nm{flex:1;min-width:0}
.author .nm b{display:block}
.author .nm small{color:var(--fg2)}
.desc{color:var(--fg);font-size:14px;line-height:1.5;margin:0}
.stats{display:flex;gap:16px;color:var(--fg2);font-size:13px;font-weight:600}
.stats span{display:flex;gap:5px;align-items:center}
.stats svg{width:16px;height:16px}
.cm-h{font-weight:700;font-size:15px;margin-top:4px;display:flex;justify-content:space-between}
.cm-h small{font-weight:500;color:var(--fg2)}
.cms{display:flex;flex-direction:column;gap:12px;max-height:260px;overflow:auto}
.cm{display:flex;gap:10px;font-size:13.5px}
.cm .av{width:32px;height:32px;font-size:12px}
.cm b{font-weight:700;margin-right:4px}
.cm small{display:block;color:var(--fg3);font-size:12px;margin-top:2px}
.cm-in{display:flex;gap:8px;align-items:center;margin-top:auto}
.cm-in input{flex:1;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);padding:0 16px;outline:0;min-width:0}
.related{padding:18px 22px 28px;border-top:1px solid var(--line)}
.related h3{margin:0 0 14px;font-size:18px}
#rgrid{position:relative;contain:layout}
#rgrid .card{cursor:pointer}

/* ---- narrow ---- */
@media (max-width:900px){
  .seg .lbl{display:none}
  .lb-body{grid-template-columns:1fr}
  .side{border-left:0;border-top:1px solid var(--line)}
  .native .lbl{display:none}
}
@media (max-width:760px){
  :root{--rail:56px;--pad:16px;--gap:12px}
  .mark{width:34px;height:34px;font-size:13px}
  .rbtn{width:42px;height:42px}
  .search{flex-basis:200px;height:42px}
  .search kbd{display:none}
  dialog#lb{width:calc(100% - 16px);max-height:calc(100% - 16px);border-radius:18px}
  .nav{width:40px;height:40px}
  .hud{left:calc(var(--rail) + 8px);bottom:8px}
}
</style>
</head>
<body>

<nav class="rail" aria-label="Main">
  <div class="mark" title="Better Browsing · Fast UI">bb</div>
  <button class="rbtn on" data-nav="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.8 10.6a1 1 0 0 0 1.25 1.56L5 11.4V20a1 1 0 0 0 1 1h4.5v-6h3v6H18a1 1 0 0 0 1-1v-8.6l.95.76a1 1 0 0 0 1.25-1.56z"/></svg><span class="tip">Home</span></button>
  <button class="rbtn" data-nav="explore" aria-label="Explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z" fill="currentColor" stroke-linejoin="round"/></svg><span class="tip">Explore (Pinterest)</span></button>
  <button class="rbtn" data-nav="boards" aria-label="Boards"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/></svg><span class="tip">Boards</span></button>

    trk.style.width = (L.t / p.dur * 100) + '%';
    stBox.querySelector('[data-v="t"]').textContent = mmss(Math.floor(L.t));
    stArt.style.backgroundPosition = `${50 + Math.sin(now / 2400) * 40}% ${50 + Math.cos(now / 3100) * 40}%`;
    L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}
function stopVideo() {
  L.playing = false; cancelAnimationFrame(L.raf);
  stArt.classList.remove('playing'); stArt.style.backgroundSize = ''; stArt.style.backgroundPosition = '';
  const b = stBox.querySelector('.bigplay'); if (b) b.style.display = '';
  const pp = stBox.querySelector('[data-v="pp"]'); if (pp) pp.innerHTML = ICON.play;
}

function side(p) {
  const s = $('#side');
  const saved = S.saved.get(p.id);
  const r = rng(+p.id.slice(-6));
  const n = Math.min(6, Math.max(2, p.comments % 7));
  const cms = [];
  for (let k = 0; k < n; k++) { const a = AVATAR(pick(PEOPLE, r)); cms.push(`<div class="cm"><i class="av" style="background:${a.c}">${a.i}</i><div><b>${a.user}</b>${pick(CMT, r)}<small>${1 + Math.floor(r() * 50)}w · ${Math.floor(r() * 40)} likes</small></div></div>`); }
  s.innerHTML = `
    <div class="saverow">
      <button class="bsel" data-pick id="sideBoard"><span>${saved || S.lastBoard}</span>${ICON.caret}</button>
      <span class="grow"></span>
      <button class="bigsave ${saved ? 'done' : ''}" id="sideSave">${saved ? 'Saved' : 'Save'}</button>
    </div>
    <div><a class="dom" href="#" onclick="return false">${p.domain}</a></div>
    ${p.title ? `<h2>${p.title}</h2>` : ''}
    <div class="author"><i class="av" style="background:${p.author.c}">${p.author.i}</i><div class="nm"><b>${p.author.name}</b><small>${fmt(1200 + p.saves * 3)} followers</small></div><button class="btn" id="follow">Follow</button></div>
    <p class="desc">${p.desc}</p>
    <div class="stats"><span>${ICON.heart}${fmt(p.saves)} saves</span><span>${ICON.chat}${p.comments} comments</span><span>${ICON.pin}${p.board}</span></div>
    <div class="cm-h">Comments <small>first 10 · UnifiedCommentsResource</small></div>
    <div class="cms" id="cms">${cms.join('')}</div>
    <div class="cm-in"><input id="cmIn" placeholder="Add a comment"><button class="btn dark" id="cmGo">Post</button></div>`;
  s.querySelector('#sideSave').onclick = () => saved ? openPicker(p, s.querySelector('#sideSave')) : saveTo(p, S.lastBoard);
  s.querySelector('#sideBoard').onclick = e => { e.stopPropagation(); if (pickFor === p) closePicker(); else openPicker(p, s.querySelector('#sideBoard')); };
  const f = s.querySelector('#follow'); f.onclick = () => { const on = f.classList.toggle('dark'); f.textContent = on ? 'Following' : 'Follow'; };
  const post = () => { const v = s.querySelector('#cmIn').value.trim(); if (!v) return; s.querySelector('#cms').insertAdjacentHTML('afterbegin', `<div class="cm"><i class="av" style="background:#111">Y</i><div><b>you</b></div></div>`); s.querySelector('#cms .cm b').after(document.createTextNode(v)); s.querySelector('#cms .cm div').append(el('small', '', 'just now')); s.querySelector('#cmIn').value = ''; };
  s.querySelector('#cmGo').onclick = post;
  s.querySelector('#cmIn').onkeydown = e => { if (e.key === 'Enter') post(); };
}

// Related pins: same masonry engine, sized to the dialog; <= 24 cards, so no windowing needed here
const RM = Masonry({ gap: 12, minCol: 150, maxCols: 5, footer: () => 0 });
function related() {
  const p = cur(), box = $('#rgrid');
  const r = rng(+p.id.slice(-7) + 3);
  const same = ALL.filter(q => q !== p && !isPromotedData(q) && (q.board === p.board || q.kind === p.kind) && r() < 0.06).slice(0, 24);
  RM.setWidth(box.clientWidth || 600); RM.reset(); RM.append(same);
  box.textContent = '';
  box.style.height = RM.height() + 'px';
  same.forEach((q, k) => {
    const node = tmpl(), rc = RM.rect(k); rc.i = k;
    fill(node, q, rc); node.dataset.i = k; node._q = q;
    node._ft.style.display = 'none'; node._m.style.height = rc.h + 'px';
    box.append(node);
  });
}
$('#rgrid').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const q = card._q;
  if (e.target.closest('.save')) { e.stopPropagation(); saveTo(q, S.lastBoard); card.classList.add('saved'); card._sv.textContent = 'Saved'; return; }
  if (e.target.closest('.bchip')) { e.stopPropagation(); openPicker(q, card.querySelector('.bchip')); return; }
  L.stack.push({ p: q, src: 'related' }); show(); lb.scrollTop = 0;       // ov.push: Back pops one level
});

/* =====================================================================================================
   keys.js (M3 preview)
   ===================================================================================================== */
addEventListener('keydown', e => {
  const typing = e.target.closest?.('input,textarea,[contenteditable]');
  if (e.altKey && e.shiftKey && e.code === 'KeyP') { e.preventDefault(); goNative(); return; }
  if (typing) return;
  if (lb.open) {
    if (e.key === 'ArrowRight') { e.preventDefault(); if (!storyStep(1)) step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); if (!storyStep(-1)) step(-1); }
    else if (e.key === 'ArrowDown' && cur().kind === 'story') { e.preventDefault(); storyStep(1); }
    else if (e.key === 'ArrowUp' && cur().kind === 'story') { e.preventDefault(); storyStep(-1); }
    else if (e.key === 'Backspace' && L.stack.length > 1) { e.preventDefault(); $('#lbBack').click(); }
    else if (e.key === 's') { e.preventDefault(); saveTo(cur(), S.lastBoard); }
    else if (e.key === ' ' && cur().kind === 'video') { e.preventDefault(); L.playing ? stopVideo() : play(); }
    return;
  }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') closePicker();
});

/* =====================================================================================================
   boot: first page from "the SSR JSON", then pages by bookmark
   ===================================================================================================== */
chips();
S.view = [];
M.setWidth(measure());
M.reset();
grid.style.width = M.width() + 'px';
addPins(fetchPage(PAGE * 2));
if (innerWidth < 900) $('#hudMin').click();
relayout({ keepAnchor: false });
})();
</script>
