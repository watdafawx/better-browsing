<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Better Browsing</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <img src="../icons/icon48.png" alt="" width="28" height="28">
  <div><h1>Better Browsing</h1><p id="ver"></p></div>
</header>
<p id="note" hidden></p>
<ul id="sites"></ul>
<div class="io">
  <button id="exportBtn" type="button">Export all</button>
  <button id="importBtn" type="button">Import all</button>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
  <span id="ioMsg" class="iomsg" aria-live="polite"></span>
</div>
<footer>Settings open on the site itself: the gear in the page, or Alt+W.</footer>
<script src="popup.js"></script>
</body>
</html>
